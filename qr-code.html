<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Kód - Scavenger Hunt PWA</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
    }
    .card {
      background: #161616;
      border: 1px solid #2a2a2a;
      border-radius: 24px;
      padding: 32px 24px;
      max-width: 360px;
      width: 90%;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .badge {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid #a855f7;
      color: #c084fc;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
    }
    h1 {
      font-size: 24px;
      margin: 0;
      color: #fff;
    }
    p {
      color: #a3a3a3;
      font-size: 14px;
      margin: 0;
      line-height: 1.4;
    }
    .qr-frame {
      background: #fff;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin: 8px 0;
    }
    .qr-frame img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .url {
      background: #0a0a0a;
      border: 1px solid #333;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 12px;
      color: #a855f7;
      word-break: break-all;
      text-decoration: none;
      font-weight: 600;
    }
    .instructions {
      font-size: 12px;
      color: #737373;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">🦇 Scavenger Hunt PWA</div>
    <h1>Naskenuj a hraj</h1>
    <p>Namíř foťákem mobilu na QR kód a otevři hru v prohlížeči.</p>

    <div class="qr-frame">
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://rypik.github.io/scavenger-hunt/" alt="QR Kód hry" />
    </div>

    <a href="https://rypik.github.io/scavenger-hunt/" target="_blank" class="url">
      https://rypik.github.io/scavenger-hunt/
    </a>

    <p class="instructions">
      💡 <b>Tip na mobilu:</b> V menu prohlížeče klikni na <i>„Přidat na plochu“</i> nebo <i>„Nainstalovat aplikaci“</i>.
    </p>
  </div>
</body>
</html>
